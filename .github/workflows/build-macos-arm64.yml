name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS arm64 (M1 and newer)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13 arm64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip

      - name: Verify native architecture
        run: |
          test "$(uname -m)" = "arm64"
          python3 -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Build application, ZIP, and DMG
        run: bash build_macos_arm64.sh

      - name: Verify application architecture
        run: |
          file "dist/TRIGRIX Studio.app/Contents/MacOS/TRIGRIX Studio"
          lipo -verify_arch arm64 "dist/TRIGRIX Studio.app/Contents/MacOS/TRIGRIX Studio"
          test -f "dist/TRIGRIX-Studio-macOS-arm64.zip"
          test -f "dist/TRIGRIX-Studio-macOS-arm64.dmg"

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v4
        with:
          name: TRIGRIX-Studio-macOS-arm64
          path: |
            dist/TRIGRIX-Studio-macOS-arm64.zip
            dist/TRIGRIX-Studio-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30
